bio: |
  I am a master’s student in National Development at National Taiwan University. My research asks how political language and attitudes can be measured: how to turn what firms and legislators say and do about China into numbers that can be compared.

  Two current papers show this. One uses language models to measure state discourse in Chinese corporate reports. The other asks why European legislators break from their party group on China-related votes. I am also interested in how people in Taiwan perceive China.

  My training is in finance and economics. Working as a research and teaching assistant in text mining and GIS taught me to build analyses that others can reproduce, and my internships in banking and real estate valuation showed me how much a conclusion depends on how something is measured.

